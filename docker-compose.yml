services:

  db:
    image: mysql:8.0
    container_name: sijadwal-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: db_penjadwalan
      MYSQL_USER: sijadwal
      MYSQL_PASSWORD: sijadwal_secret
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - sijadwal-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  python-app:
    build:
      context: ./sistem-penjadwalan-python
      dockerfile: Dockerfile
    container_name: sijadwal-python
    restart: unless-stopped
    ports:
      - "8080:8000"
    networks:
      - sijadwal-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  laravel-app:
    build:
      context: ./sistem-penjadwalan-laravel
      dockerfile: Dockerfile
    container_name: sijadwal-laravel
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=db_penjadwalan
      - DB_USERNAME=sijadwal
      - DB_PASSWORD=sijadwal_secret
    depends_on:
      db:
        condition: service_healthy
      python-app:
        condition: service_healthy
    volumes:
      - laravel_storage:/var/www/html/storage
    networks:
      - sijadwal-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: sijadwal-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sijadwal-net

volumes:
  db_data:
  laravel_storage:

networks:
  sijadwal-net:
    driver: bridge